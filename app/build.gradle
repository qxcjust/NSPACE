plugins {
  id 'com.android.application'
}

android {
  namespace 'com.nspace.mediacenter'
  compileSdk 34
  buildToolsVersion '35.0.0'

  defaultConfig {
    applicationId "com.nspace.mediacenter"
    minSdk 24
    targetSdk 33
    versionCode 1
    versionName "1.0.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    debug {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // AGP 8.0+ disables BuildConfig generation by default; re-enable it so
  // BuildConfig.VERSION_NAME can be referenced for the "version" string.
  buildFeatures {
    buildConfig true
  }

  lintOptions {
    abortOnError false
    disable 'MissingTranslation'
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'com.google.android.material:material:1.11.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
  implementation 'androidx.legacy:legacy-support-v4:1.0.0'
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  implementation 'androidx.webkit:webkit:1.9.0'
  implementation 'androidx.preference:preference:1.2.1'

  // MMKV (Tencent) key-value storage.
  // Default: official Maven artifact, which is the compiled output of the
  // Tencent MMKV open-source source. To build MMKV from the Gitee source
  // instead, see README.md -> "Building MMKV from source" and switch to:
  //   implementation project(':mmkv')
  implementation 'com.tencent:mmkv:1.3.11'

  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
