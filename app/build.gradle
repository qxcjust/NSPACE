plugins {
  id 'com.android.application'
}

android {
  namespace 'com.nspace.mediacenter'
  compileSdk 34
  buildToolsVersion '35.0.0'

  // Load release signing credentials from the gitignored local.properties.
  def localProps = new Properties()
  def localPropsFile = rootProject.file('local.properties')
  if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
  }
  def storeFileProp = localProps.getProperty('nspace.store.file')
  def storePass = localProps.getProperty('nspace.store.password')
  def keyAliasProp = localProps.getProperty('nspace.key.alias')
  def keyPass = localProps.getProperty('nspace.key.password')

  signingConfigs {
    release {
      if (storeFileProp != null && storePass != null && keyAliasProp != null && keyPass != null) {
        storeFile file(storeFileProp)
        storeType "PKCS12"
        storePassword storePass
        keyAlias keyAliasProp
        keyPassword keyPass
      }
    }
  }

  // ---- Version: single source of truth ----
  // Release v2.1.0.48 = v2.1.0.47 + media-key forwarding for cross-origin
  //   iframe players. Root cause of BOTH "Stingray can't be controlled via
  //   MediaSession" AND "Douyin closes, playback never resumes": our injected
  //   JS (FIND_MEDIA_JS) runs in the top-page context and Same-Origin Policy
  //   blocks it from the player's <video> when the player is a cross-origin
  //   iframe (Stingray / Deezer / …), so play()/pause()/setVolume() are no-ops.
  //   Fix: resumePlayback() and the MediaSession onPlay/onPause callbacks now
  //   ALSO forward KEYCODE_MEDIA_PLAY/PAUSE into the WebView, so Chromium's
  //   native media session (which controls all in-renderer media, iframes
  //   included) plays/pauses them. checkExternalPlayback rewritten: while an
  //   interruption is latched and we're not actually playing, retry resume on a
  //   throttle (RESUME_RETRY_MS=4s, budget RESUME_MAX_ATTEMPTS=30) — this covers
  //   a paused iframe element AND the isMusicActive()-stuck-true blind spot, and
  //   lands once the user returns to the foreground (WebView refocused). A
  //   separate branch keeps kicking focus for the "playing but silent" (duck
  //   multiplier stuck at 0) case until focus is held. versionCode monotonic.
  def appVersionName = "2.1.0.48"
  def appVersionCode = 2010048   // 2*1_000_000 + 1*10_000 + 0*100 + 48

  defaultConfig {
    applicationId "com.nspace.mediacenter"
    minSdk 24
    targetSdk 33
    versionCode appVersionCode
    versionName appVersionName
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    // AES-256-GCM keys are NO LONGER injected as BuildConfig literals: a single
    // regex over classes.dex could previously extract them. They are now
    // reconstructed at runtime from obfuscated fragments in util/KeyVault, which
    // reads the build-time secrets from local.properties only to ENCRYPT the
    // assets — the plaintext key never ships in the APK.
    //
    // AID_REMOTE_URL is the public base for per-ANDROID_ID authorization files
    // hosted on GitHub Pages; the app appends "<android_id>.enc" at runtime.
    def aidRemoteUrl = localProps.getProperty('nspace.aid_remote.url')
    buildConfigField "String", "AID_REMOTE_URL", "\"" + (aidRemoteUrl != null ? aidRemoteUrl : "https://www.cyaispace.tech/aid/") + "\""
  }

  buildTypes {
    release {
      // Anti-decompile: full R8 obfuscation + optimization.
      // NOTE: shrinkResources is intentionally DISABLED. The resource shrinker
      // silently drops res/xml/network_security_config.xml (referenced only via
      // android:networkSecurityConfig in the manifest, which it does not treat as
      // a keep-reachable reference), breaking TLS certificate pinning. Code-level
      // hardening (R8 + key obfuscation + self-integrity) is unaffected; the
      // marginal APK size gain is not worth losing the pinning.
      minifyEnabled true
      shrinkResources false
      zipAlignEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.release
    }
    debug {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // AGP 8.0+ disables BuildConfig generation by default; re-enable it so
  // BuildConfig.VERSION_NAME can be referenced for the "version" string.
  buildFeatures {
    buildConfig true
  }

  lintOptions {
    abortOnError false
    checkReleaseBuilds false
    disable 'MissingTranslation'
  }

  // Standardize output APK naming: NSpace-v<versionName>-<buildType>.apk
  applicationVariants.all { variant ->
    variant.outputs.all { output ->
      outputFileName = "NSpace-v${variant.versionName}-${variant.buildType.name}.apk"
    }
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'com.google.android.material:material:1.11.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
  implementation 'androidx.legacy:legacy-support-v4:1.0.0'
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  implementation 'androidx.webkit:webkit:1.9.0'
  implementation 'androidx.preference:preference:1.2.1'

  // MMKV (Tencent) key-value storage.
  // Default: official Maven artifact, which is the compiled output of the
  // Tencent MMKV open-source source. To build MMKV from the Gitee source
  // instead, see README.md -> "Building MMKV from source" and switch to:
  //   implementation project(':mmkv')
  implementation 'com.tencent:mmkv:1.3.11'

  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
